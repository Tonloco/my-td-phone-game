<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#10131c" />
<title>Pocket Survivor</title>
<style>
  :root {
    --bg: #10131c;
    --panel: rgba(19, 24, 37, 0.92);
    --accent: #75f0b4;
    --danger: #ff6b6b;
    --gold: #ffd166;
    --text: #f5f7ff;
    --muted: #aeb6cd;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
  }
  #gameWrap { position: fixed; inset: 0; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; background: #151a26; }

  .hud {
    position: fixed; top: env(safe-area-inset-top); left: 0; right: 0;
    padding: 10px 12px; display: grid; gap: 7px; pointer-events: none;
  }
  .topRow { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  .pill {
    background: rgba(10,13,20,.72); border: 1px solid rgba(255,255,255,.09);
    border-radius: 999px; padding: 7px 10px; font-weight: 700; font-size: 14px;
    backdrop-filter: blur(8px);
  }
  .bars { display: grid; gap: 5px; }
  .bar {
    height: 10px; border-radius: 999px; overflow: hidden;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.08);
  }
  .fill { height: 100%; width: 50%; transition: width .12s linear; }
  #hpFill { background: linear-gradient(90deg,#ff5d73,#ff9b8e); }
  #xpFill { background: linear-gradient(90deg,#59d9ff,#8b8cff); }

  #stickBase {
    position: fixed; left: 22px; bottom: calc(22px + env(safe-area-inset-bottom));
    width: 126px; height: 126px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.13);
    backdrop-filter: blur(5px);
  }
  #stickKnob {
    position: absolute; left: 33px; top: 33px; width: 60px; height: 60px; border-radius: 50%;
    background: rgba(117,240,180,.72); border: 2px solid rgba(255,255,255,.2);
    box-shadow: 0 0 22px rgba(117,240,180,.22);
  }

  .screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 22px; background: radial-gradient(circle at top, rgba(75,95,150,.28), rgba(7,9,15,.96));
    z-index: 20;
  }
  .card {
    width: min(520px, 100%); max-height: 90vh; overflow: auto;
    background: var(--panel); border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  h1,h2,p { margin-top: 0; }
  h1 { font-size: clamp(34px, 8vw, 56px); margin-bottom: 8px; letter-spacing: -1.5px; }
  .subtitle { color: var(--muted); line-height: 1.45; }
  button {
    width: 100%; border: 0; border-radius: 16px; padding: 15px 16px;
    font-size: 17px; font-weight: 800; color: #0d1713; background: var(--accent);
    margin-top: 10px; cursor: pointer;
  }
  button.secondary { background: #2b3347; color: var(--text); }
  .upgradeGrid { display: grid; gap: 12px; }
  .upgrade {
    text-align: left; background: #20283a; color: var(--text);
    border: 1px solid rgba(255,255,255,.09); padding: 16px;
  }
  .upgrade strong { display: block; font-size: 18px; margin-bottom: 4px; }
  .upgrade span { color: var(--muted); font-size: 14px; font-weight: 600; }
  .tiny { font-size: 12px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="topRow">
      <div class="pill" id="levelText">LV 1</div>
      <div class="pill" id="timeText">0:00</div>
      <div class="pill" id="scoreText">0 KOs</div>
    </div>
    <div class="bars">
      <div class="bar"><div class="fill" id="hpFill"></div></div>
      <div class="bar"><div class="fill" id="xpFill"></div></div>
    </div>
  </div>

  <div id="stickBase"><div id="stickKnob"></div></div>

  <div id="startScreen" class="screen">
    <div class="card">
      <h1>Pocket Survivor</h1>
      <p class="subtitle">
        Survive endless enemy waves, collect energy shards, and build a ridiculous little combat machine.
        Move with the joystick. Your weapon fires automatically.
      </p>
      <button id="startBtn">Start Run</button>
      <p class="tiny">Tip: In Safari, use Share → Add to Home Screen for an app-like icon.</p>
    </div>
  </div>

  <div id="upgradeScreen" class="screen hidden">
    <div class="card">
      <h2>Choose an Upgrade</h2>
      <div class="upgradeGrid" id="upgradeGrid"></div>
    </div>
  </div>

  <div id="gameOverScreen" class="screen hidden">
    <div class="card">
      <h2>Run Over</h2>
      <p class="subtitle" id="gameOverStats"></p>
      <button id="restartBtn">Try Again</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const hpFill = document.getElementById("hpFill");
  const xpFill = document.getElementById("xpFill");
  const levelText = document.getElementById("levelText");
  const timeText = document.getElementById("timeText");
  const scoreText = document.getElementById("scoreText");
  const startScreen = document.getElementById("startScreen");
  const upgradeScreen = document.getElementById("upgradeScreen");
  const gameOverScreen = document.getElementById("gameOverScreen");
  const upgradeGrid = document.getElementById("upgradeGrid");
  const gameOverStats = document.getElementById("gameOverStats");
  const stickBase = document.getElementById("stickBase");
  const stickKnob = document.getElementById("stickKnob");

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = innerWidth, H = innerHeight;
  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener("resize", resize);
  resize();

  const rand = (a,b) => Math.random()*(b-a)+a;
  const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
  const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);

  let running = false, pausedForUpgrade = false, last = 0, elapsed = 0;
  let enemies = [], bullets = [], gems = [], particles = [];
  let spawnTimer = 0, kills = 0;

  const player = {
    x: W/2, y: H/2, r: 17,
    speed: 190, hp: 100, maxHp: 100,
    level: 1, xp: 0, xpNeed: 8,
    damage: 18, fireRate: 0.58, fireTimer: 0,
    bulletSpeed: 520, projectileCount: 1,
    pickupRange: 80, armor: 0, regen: 0,
    size: 1
  };

  const stick = { active:false, id:null, x:0, y:0, max:42 };

  function resetGame() {
    enemies = []; bullets = []; gems = []; particles = [];
    elapsed = 0; spawnTimer = 0; kills = 0;
    Object.assign(player, {
      x: W/2, y: H/2, r: 17, speed: 190,
      hp: 100, maxHp: 100, level: 1, xp: 0, xpNeed: 8,
      damage: 18, fireRate: .58, fireTimer: 0,
      bulletSpeed: 520, projectileCount: 1,
      pickupRange: 80, armor: 0, regen: 0, size: 1
    });
    updateHUD();
  }

  function startGame() {
    resetGame();
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    upgradeScreen.classList.add("hidden");
    pausedForUpgrade = false;
    running = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }

  document.getElementById("startBtn").onclick = startGame;
  document.getElementById("restartBtn").onclick = startGame;

  function pointerPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return {x:t.clientX, y:t.clientY};
  }

  function startStick(e) {
    const p = pointerPos(e);
    const rect = stickBase.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    if (Math.hypot(p.x-cx,p.y-cy) < 90) {
      stick.active = true;
      stick.id = e.pointerId ?? null;
      moveStickPoint(p.x,p.y,cx,cy);
    }
  }

  function moveStickPoint(px,py,cx,cy) {
    let dx = px-cx, dy = py-cy;
    const len = Math.hypot(dx,dy) || 1;
    if (len > stick.max) { dx = dx/len*stick.max; dy = dy/len*stick.max; }
    stick.x = dx/stick.max; stick.y = dy/stick.max;
    stickKnob.style.transform = `translate(${dx}px,${dy}px)`;
  }

  stickBase.addEventListener("pointerdown", e => { e.preventDefault(); startStick(e); stickBase.setPointerCapture?.(e.pointerId); });
  stickBase.addEventListener("pointermove", e => {
    if (!stick.active) return;
    const rect = stickBase.getBoundingClientRect();
    moveStickPoint(e.clientX,e.clientY,rect.left+rect.width/2,rect.top+rect.height/2);
  });
  function endStick() {
    stick.active=false; stick.x=0; stick.y=0;
    stickKnob.style.transform = "translate(0px,0px)";
  }
  stickBase.addEventListener("pointerup", endStick);
  stickBase.addEventListener("pointercancel", endStick);

  const keys = {};
  addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
  addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

  function spawnEnemy() {
    const side = Math.floor(Math.random()*4);
    let x,y;
    if (side===0) {x=rand(-30,W+30);y=-30;}
    if (side===1) {x=W+30;y=rand(-30,H+30);}
    if (side===2) {x=rand(-30,W+30);y=H+30;}
    if (side===3) {x=-30;y=rand(-30,H+30);}

    const difficulty = 1 + elapsed/55;
    const roll = Math.random();
    let type = "blob", r=14, speed=55+rand(0,18), hp=28, damage=10, color="#ff7b7b";
    if (roll > .78) { type="runner"; r=11; speed=100+elapsed*.45; hp=19*difficulty; damage=8; color="#ffbe5c"; }
    if (roll > .93 && elapsed > 20) { type="tank"; r=24; speed=38+elapsed*.15; hp=95*difficulty; damage=18; color="#b77cff"; }
    enemies.push({x,y,r,speed,hp,maxHp:hp,damage,color,type,hitFlash:0});
  }

  function shoot() {
    if (!enemies.length) return;
    let target = enemies[0], best = dist(player,target);
    for (const e of enemies) {
      const d = dist(player,e);
      if (d < best) { best=d; target=e; }
    }
    const angle = Math.atan2(target.y-player.y,target.x-player.x);
    const spread = .17;
    for (let i=0;i<player.projectileCount;i++) {
      const offset = (i-(player.projectileCount-1)/2)*spread;
      const a = angle+offset;
      bullets.push({
        x:player.x, y:player.y, r:5,
        vx:Math.cos(a)*player.bulletSpeed,
        vy:Math.sin(a)*player.bulletSpeed,
        damage:player.damage, life:1.3
      });
    }
  }

  function gainXp(amount) {
    player.xp += amount;
    while (player.xp >= player.xpNeed) {
      player.xp -= player.xpNeed;
      player.level++;
      player.xpNeed = Math.floor(player.xpNeed*1.28+2);
      showUpgrades();
      break;
    }
  }

  const upgrades = [
    {name:"Hotter Shots", desc:"+35% damage", apply:()=>player.damage*=1.35},
    {name:"Rapid Trigger", desc:"Shoot 18% faster", apply:()=>player.fireRate*=.82},
    {name:"Fleet Feet", desc:"+14% movement speed", apply:()=>player.speed*=1.14},
    {name:"Twin Shot", desc:"+1 projectile", apply:()=>player.projectileCount++},
    {name:"Iron Shell", desc:"+2 armor", apply:()=>player.armor+=2},
    {name:"Big Battery", desc:"+25 maximum health and heal 25", apply:()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25)}},
    {name:"Magnet Core", desc:"+45 pickup range", apply:()=>player.pickupRange+=45},
    {name:"Nano Repair", desc:"+1.5 health per second", apply:()=>player.regen+=1.5},
    {name:"Overclocked Ammo", desc:"+20% bullet speed and +10% damage", apply:()=>{player.bulletSpeed*=1.2;player.damage*=1.1}},
  ];

  function showUpgrades() {
    pausedForUpgrade = true;
    upgradeScreen.classList.remove("hidden");
    upgradeGrid.innerHTML = "";
    const picks = [...upgrades].sort(()=>Math.random()-.5).slice(0,3);
    picks.forEach(up => {
      const b = document.createElement("button");
      b.className = "upgrade";
      b.innerHTML = `<strong>${up.name}</strong><span>${up.desc}</span>`;
      b.onclick = () => {
        up.apply();
        pausedForUpgrade = false;
        upgradeScreen.classList.add("hidden");
        last = performance.now();
      };
      upgradeGrid.appendChild(b);
    });
  }

  function addParticles(x,y,color,count=8) {
    for(let i=0;i<count;i++){
      const a=rand(0,Math.PI*2), s=rand(35,130);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.6),color});
    }
  }

  function update(dt) {
    elapsed += dt;
    const keyX = (keys["d"]||keys["arrowright"]?1:0) - (keys["a"]||keys["arrowleft"]?1:0);
    const keyY = (keys["s"]||keys["arrowdown"]?1:0) - (keys["w"]||keys["arrowup"]?1:0);
    let mx = stick.x || keyX, my = stick.y || keyY;
    const ml = Math.hypot(mx,my);
    if (ml > 1) { mx/=ml; my/=ml; }
    player.x = clamp(player.x + mx*player.speed*dt, player.r, W-player.r);
    player.y = clamp(player.y + my*player.speed*dt, player.r+45, H-player.r);

    player.hp = Math.min(player.maxHp, player.hp + player.regen*dt);

    player.fireTimer -= dt;
    if (player.fireTimer <= 0) {
      shoot();
      player.fireTimer = player.fireRate;
    }

    spawnTimer -= dt;
    const spawnGap = Math.max(.18, .74 - elapsed*.0045);
    if (spawnTimer <= 0) {
      spawnEnemy();
      if (elapsed > 35 && Math.random() < .2) spawnEnemy();
      spawnTimer = spawnGap;
    }

    for (const b of bullets) {
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    }

    for (const e of enemies) {
      const a = Math.atan2(player.y-e.y,player.x-e.x);
      e.x += Math.cos(a)*e.speed*dt;
      e.y += Math.sin(a)*e.speed*dt;
      e.hitFlash = Math.max(0,e.hitFlash-dt);

      if (dist(e,player) < e.r+player.r) {
        const actual = Math.max(1,e.damage-player.armor);
        player.hp -= actual*dt*2.2;
        const push = 26*dt;
        e.x -= Math.cos(a)*push; e.y -= Math.sin(a)*push;
      }
    }

    for (const b of bullets) {
      if (b.life <= 0) continue;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        if (Math.hypot(b.x-e.x,b.y-e.y) < b.r+e.r) {
          e.hp -= b.damage;
          e.hitFlash = .08;
          b.life = 0;
          addParticles(b.x,b.y,"#ffe8a3",4);
          break;
        }
      }
    }

    for (const e of enemies) {
      if (e.hp <= 0 && !e.dead) {
        e.dead = true; kills++;
        gems.push({x:e.x,y:e.y,r:7,value:e.type==="tank"?4:1,pulse:rand(0,6)});
        addParticles(e.x,e.y,e.color,12);
      }
    }

    for (const g of gems) {
      g.pulse += dt*6;
      const d = dist(g,player);
      if (d < player.pickupRange) {
        const a = Math.atan2(player.y-g.y,player.x-g.x);
        const speed = 140 + (player.pickupRange-d)*3;
        g.x += Math.cos(a)*speed*dt;
        g.y += Math.sin(a)*speed*dt;
      }
      if (d < player.r+g.r+4 && !g.collected) {
        g.collected = true; gainXp(g.value);
      }
    }

    for (const p of particles) {
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.96; p.vy*=.96; p.life-=dt;
    }

    bullets = bullets.filter(b=>b.life>0 && b.x>-40&&b.x<W+40&&b.y>-40&&b.y<H+40);
    enemies = enemies.filter(e=>!e.dead && e.x>-90&&e.x<W+90&&e.y>-90&&e.y<H+90);
    gems = gems.filter(g=>!g.collected);
    particles = particles.filter(p=>p.life>0);

    if (player.hp <= 0) endGame();
    updateHUD();
  }

  function updateHUD() {
    hpFill.style.width = `${clamp(player.hp/player.maxHp*100,0,100)}%`;
    xpFill.style.width = `${clamp(player.xp/player.xpNeed*100,0,100)}%`;
    levelText.textContent = `LV ${player.level}`;
    scoreText.textContent = `${kills} KOs`;
    const m = Math.floor(elapsed/60), s = Math.floor(elapsed%60).toString().padStart(2,"0");
    timeText.textContent = `${m}:${s}`;
  }

  function drawGrid() {
    ctx.fillStyle = "#151a26";
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.lineWidth = 1;
    const size = 42, ox = (elapsed*8)%size, oy=(elapsed*5)%size;
    for(let x=-size+ox;x<W+size;x+=size){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=-size+oy;y<H+size;y+=size){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }

  function draw() {
    drawGrid();

    for (const g of gems) {
      const pulse = 1+Math.sin(g.pulse)*.12;
      ctx.save(); ctx.translate(g.x,g.y); ctx.scale(pulse,pulse);
      ctx.rotate(Math.PI/4);
      ctx.fillStyle="#65e4ff"; ctx.fillRect(-g.r,-g.r,g.r*2,g.r*2);
      ctx.restore();
    }

    for (const b of bullets) {
      ctx.fillStyle="#ffe083";
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    }

    for (const e of enemies) {
      ctx.fillStyle = e.hitFlash>0 ? "#ffffff" : e.color;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(0,0,0,.25)";
      ctx.beginPath(); ctx.arc(e.x-e.r*.28,e.y-e.r*.1,Math.max(2,e.r*.13),0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x+e.r*.28,e.y-e.r*.1,Math.max(2,e.r*.13),0,Math.PI*2); ctx.fill();

      if (e.type==="tank") {
        ctx.fillStyle="rgba(0,0,0,.35)";
        ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,4);
        ctx.fillStyle="#75f0b4";
        ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*(e.hp/e.maxHp),4);
      }
    }

    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life*2,0,1);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x-2,p.y-2,4,4);
    }
    ctx.globalAlpha=1;

    ctx.save();
    ctx.translate(player.x,player.y);
    ctx.scale(player.size,player.size);
    ctx.shadowColor="rgba(117,240,180,.45)";
    ctx.shadowBlur=18;
    ctx.fillStyle="#75f0b4";
    ctx.beginPath(); ctx.arc(0,0,player.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#17251f";
    ctx.fillRect(-8,-4,5,5);
    ctx.fillRect(3,-4,5,5);
    ctx.fillRect(-6,6,12,3);
    ctx.restore();
  }

  function endGame() {
    running = false;
    gameOverStats.textContent = `You survived ${Math.floor(elapsed)} seconds, reached level ${player.level}, and defeated ${kills} enemies.`;
    gameOverScreen.classList.remove("hidden");
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(.033,(now-last)/1000);
    last = now;
    if (!pausedForUpgrade) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  draw();
})();
</script>
</body>
</html>
