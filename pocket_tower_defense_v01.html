<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#14251a" />
<title>Pocket Tower Defense</title>
<style>
  :root{
    --bg:#101814; --panel:#1a2920; --panel2:#22362a; --text:#f3f7f4; --muted:#a9c0b0;
    --gold:#ffd166; --danger:#ff6b6b; --good:#76d275; --blue:#74c0fc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}
  body{display:flex;justify-content:center}
  #app{width:min(100vw,760px);height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px 9px;background:#0c130f}
  .stat{background:var(--panel);border-radius:11px;padding:7px 4px;text-align:center;font-weight:750;font-size:13px}
  .stat span{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-bottom:1px}
  #gameWrap{position:relative;flex:1;min-height:0;background:#4f8d49;overflow:hidden}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  #message{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(10,20,13,.86);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
  #message.show{opacity:1}
  #startOverlay,#gameOver{position:absolute;inset:0;background:rgba(6,12,8,.72);display:flex;align-items:center;justify-content:center;padding:22px}
  .card{background:#14251a;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px;max-width:390px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .card h1,.card h2{margin:0 0 8px}
  .card p{color:#c8d8cd;line-height:1.42;margin:8px 0 16px;font-size:14px}
  button{border:0;border-radius:12px;padding:12px 14px;font-weight:850;color:#102016;background:var(--gold);font-size:14px}
  #controls{background:#0c130f;padding:8px 8px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .towerBtn{background:var(--panel);color:var(--text);padding:8px 4px;border:2px solid transparent;min-height:58px;font-size:11px}
  .towerBtn strong{display:block;font-size:13px;margin-bottom:2px}
  .towerBtn small{display:block;color:var(--gold);font-size:10px}
  .towerBtn.selected{border-color:var(--gold);background:#2a3b2f}
  .towerBtn:disabled{opacity:.42}
  #nextWave{background:#355f3d;color:white}
  #gameOver{display:none}
  #hint{font-size:10px;color:#9db3a4;text-align:center;background:#0c130f;padding:0 8px 7px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><span>BASE</span><b id="health">20</b> ❤️</div>
    <div class="stat"><span>COINS</span><b id="coins">180</b> 🪙</div>
    <div class="stat"><span>WAVE</span><b id="wave">0</b>/10</div>
    <div class="stat"><span>ENEMIES</span><b id="remaining">0</b></div>
  </header>

  <div id="gameWrap">
    <canvas id="game"></canvas>
    <div id="message"></div>

    <div id="startOverlay">
      <div class="card">
        <h1>🏰 Pocket Tower Defense</h1>
        <p>Tap a tower below, then tap the grass to place it. Enemies follow the dirt road. Survive 10 waves and defeat the boss.</p>
        <button id="startBtn">Start Defense</button>
      </div>
    </div>

    <div id="gameOver">
      <div class="card">
        <h2 id="endTitle">Game Over</h2>
        <p id="endText"></p>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="towerBtn selected" data-type="basic"><strong>🔫 Scout</strong>Fast • $60<small>Balanced</small></button>
    <button class="towerBtn" data-type="slow"><strong>❄️ Frost</strong>Slow • $85<small>Slows foes</small></button>
    <button class="towerBtn" data-type="cannon"><strong>💥 Cannon</strong>Heavy • $120<small>Big damage</small></button>
    <button id="nextWave" class="towerBtn"><strong>▶ Wave</strong>Start early<small>Bonus coins</small></button>
  </div>
  <div id="hint">Tip: towers cannot be placed on the road or too close to another tower.</div>
</div>

<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('gameWrap');
const healthEl = document.getElementById('health');
const coinsEl = document.getElementById('coins');
const waveEl = document.getElementById('wave');
const remainingEl = document.getElementById('remaining');
const msg = document.getElementById('message');
const overlay = document.getElementById('startOverlay');
const gameOver = document.getElementById('gameOver');
const endTitle = document.getElementById('endTitle');
const endText = document.getElementById('endText');
const towerBtns = [...document.querySelectorAll('.towerBtn[data-type]')];
const nextWaveBtn = document.getElementById('nextWave');

let W=0,H=0,dpr=1;
let running=false, ended=false;
let health=20, coins=180, wave=0, selected='basic';
let towers=[], enemies=[], bullets=[], particles=[];
let spawnQueue=[], spawnTimer=0, waveActive=false, nextWaveDelay=0;
let last=performance.now(), idSeq=0;

const towerTypes = {
  basic:{cost:60, range:105, rate:.48, damage:18, color:'#f7d154', projectile:'#fff0a8', radius:12},
  slow:{cost:85, range:95, rate:.75, damage:10, color:'#73c7f2', projectile:'#d8f4ff', radius:12, slow:.55},
  cannon:{cost:120, range:125, rate:1.25, damage:48, color:'#e98b58', projectile:'#ffd4b8', radius:14}
};

const pathNorm = [
  [-.08,.16],[.17,.16],[.17,.36],[.44,.36],[.44,.69],[.70,.69],[.70,.45],[.91,.45],[1.08,.45]
];
let path=[], pathSegments=[], pathWidth=48;

function resize(){
  const r=wrap.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2);
  W=r.width; H=r.height;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  pathWidth=Math.max(42, Math.min(58,W*.105));
  path=pathNorm.map(([x,y])=>({x:x*W,y:y*H}));
  pathSegments=[];
  for(let i=0;i<path.length-1;i++){
    const a=path[i], b=path[i+1];
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);
    pathSegments.push({a,b,dx,dy,len});
  }
}

function reset(){
  health=20; coins=180; wave=0; towers=[]; enemies=[]; bullets=[]; particles=[];
  spawnQueue=[]; spawnTimer=0; waveActive=false; nextWaveDelay=0; ended=false; running=true;
  gameOver.style.display='none'; updateHUD();
}

function updateHUD(){
  healthEl.textContent=health; coinsEl.textContent=Math.floor(coins); waveEl.textContent=wave;
  remainingEl.textContent=enemies.length+spawnQueue.length;
  towerBtns.forEach(b=>{
    const t=towerTypes[b.dataset.type];
    b.disabled=coins<t.cost;
  });
  nextWaveBtn.disabled = wave>=10 || !!spawnQueue.length;
}

function showMessage(text){
  msg.textContent=text; msg.classList.add('show');
  clearTimeout(showMessage.t); showMessage.t=setTimeout(()=>msg.classList.remove('show'),1200);
}

function startWave(){
  if(ended || spawnQueue.length || wave>=10) return;
  if(waveActive && enemies.length) return showMessage('Finish the current wave first');
  wave++;
  const count = wave===10 ? 1 : 5 + wave*2;
  spawnQueue=[];
  for(let i=0;i<count;i++){
    const boss=wave===10;
    const hp=boss?900:45+wave*18;
    const speed=boss?30:39+wave*1.8;
    spawnQueue.push({hp,speed,boss});
  }
  spawnTimer=0; waveActive=true; nextWaveDelay=0;
  showMessage(wave===10?'⚠️ BOSS WAVE':'Wave '+wave);
  updateHUD();
}

function spawnEnemy(cfg){
  enemies.push({
    id:++idSeq, x:path[0].x,y:path[0].y, seg:0, segPos:0,
    hp:cfg.hp,maxHp:cfg.hp,speed:cfg.speed,baseSpeed:cfg.speed,
    radius:cfg.boss?19:11,boss:cfg.boss, slowUntil:0
  });
}

function distanceToSegment(px,py,a,b){
  const vx=b.x-a.x, vy=b.y-a.y, wx=px-a.x, wy=py-a.y;
  const c1=vx*wx+vy*wy, c2=vx*vx+vy*vy;
  let t=c2?Math.max(0,Math.min(1,c1/c2)):0;
  const x=a.x+t*vx,y=a.y+t*vy;
  return Math.hypot(px-x,py-y);
}

function canPlace(x,y){
  const margin=20;
  if(x<margin||x>W-margin||y<margin||y>H-margin) return false;
  for(const s of pathSegments) if(distanceToSegment(x,y,s.a,s.b)<pathWidth*.62) return false;
  for(const t of towers) if(Math.hypot(x-t.x,y-t.y)<36) return false;
  return true;
}

function placeTower(x,y){
  const spec=towerTypes[selected];
  if(coins<spec.cost) return showMessage('Not enough coins');
  if(!canPlace(x,y)) return showMessage('Can’t place there');
  coins-=spec.cost;
  towers.push({x,y,type:selected,cooldown:0,angle:0});
  updateHUD();
}

function getPos(e){
  const r=canvas.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return {x:p.clientX-r.left,y:p.clientY-r.top};
}
canvas.addEventListener('pointerdown', e=>{
  if(!running||ended) return;
  const p=getPos(e); placeTower(p.x,p.y);
});

towerBtns.forEach(b=>b.addEventListener('click',()=>{
  selected=b.dataset.type;
  towerBtns.forEach(x=>x.classList.toggle('selected',x===b));
}));
nextWaveBtn.addEventListener('click',()=>{
  if(!running) return;
  if(!waveActive || enemies.length===0){
    if(nextWaveDelay>0){ coins+=10; showMessage('+10 early-wave bonus'); }
    startWave();
  } else showMessage('Wave already underway');
});
document.getElementById('startBtn').onclick=()=>{overlay.style.display='none';reset();startWave();};
document.getElementById('restartBtn').onclick=()=>{reset();startWave();};

function enemyProgress(e){
  let sum=0;
  for(let i=0;i<e.seg;i++) sum+=pathSegments[i].len;
  return sum+e.segPos;
}

function update(dt,now){
  if(!running||ended) return;

  if(spawnQueue.length){
    spawnTimer-=dt;
    if(spawnTimer<=0){
      spawnEnemy(spawnQueue.shift());
      spawnTimer=wave===10?0:Math.max(.38,.82-wave*.025);
    }
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.speed = now<e.slowUntil ? e.baseSpeed*.58 : e.baseSpeed;
    let move=e.speed*dt;
    while(move>0 && e.seg<pathSegments.length){
      const s=pathSegments[e.seg], left=s.len-e.segPos;
      if(move<left){e.segPos+=move; move=0;}
      else {move-=left;e.seg++;e.segPos=0;}
    }
    if(e.seg>=pathSegments.length){
      health-=e.boss?5:1;
      enemies.splice(i,1);
      burst(e.x,e.y,'#ff8d8d',8);
      if(health<=0) finish(false);
      continue;
    }
    const s=pathSegments[e.seg], q=e.segPos/s.len;
    e.x=s.a.x+s.dx*q; e.y=s.a.y+s.dy*q;
  }

  for(const t of towers){
    t.cooldown-=dt;
    let target=null,best=-Infinity;
    for(const e of enemies){
      const d=Math.hypot(e.x-t.x,e.y-t.y);
      if(d<=towerTypes[t.type].range){
        const p=enemyProgress(e);
        if(p>best){best=p;target=e;}
      }
    }
    if(target){
      t.angle=Math.atan2(target.y-t.y,target.x-t.x);
      if(t.cooldown<=0){
        const s=towerTypes[t.type];
        bullets.push({x:t.x,y:t.y,targetId:target.id,speed:t.type==='cannon'?250:330,damage:s.damage,type:t.type,color:s.projectile});
        t.cooldown=s.rate;
      }
    }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i], target=enemies.find(e=>e.id===b.targetId);
    if(!target){bullets.splice(i,1);continue;}
    const dx=target.x-b.x,dy=target.y-b.y,d=Math.hypot(dx,dy);
    const step=b.speed*dt;
    if(d<=step+target.radius){
      target.hp-=b.damage;
      if(b.type==='slow') target.slowUntil=now+1800;
      if(b.type==='cannon'){
        for(const e of enemies){
          if(e.id!==target.id && Math.hypot(e.x-target.x,e.y-target.y)<38) e.hp-=Math.round(b.damage*.35);
        }
      }
      burst(target.x,target.y,b.color,b.type==='cannon'?9:4);
      bullets.splice(i,1);
    } else {b.x+=dx/d*step;b.y+=dy/d*step;}
  }

  for(let i=enemies.length-1;i>=0;i--){
    if(enemies[i].hp<=0){
      coins+=enemies[i].boss?250:12+wave*2;
      burst(enemies[i].x,enemies[i].y,'#ffd166',10);
      enemies.splice(i,1);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life-=dt; p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;
    if(p.life<=0) particles.splice(i,1);
  }

  if(waveActive && !spawnQueue.length && !enemies.length){
    waveActive=false;
    if(wave>=10){finish(true);return;}
    nextWaveDelay+=dt;
    if(nextWaveDelay>2.5) startWave();
  }
  updateHUD();
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=20+Math.random()*60;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.25,color});
  }
}

function finish(win){
  ended=true; running=false;
  gameOver.style.display='flex';
  endTitle.textContent=win?'🏆 Victory!':'💀 Base Destroyed';
  endText.textContent=win?'You survived all 10 waves and defeated the boss. Final coins: '+Math.floor(coins)+'.':'You reached wave '+wave+'. Try a different tower mix and defend the bends.';
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // grass tiles
  ctx.fillStyle='#4d8a48'; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.12;
  for(let x=15;x<W;x+=32) for(let y=13;y<H;y+=30){
    ctx.fillStyle=((x+y)%64)?'#204e2a':'#b8d76c';
    ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // path outline and fill
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#886a43';ctx.lineWidth=pathWidth+8;
  ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke();
  ctx.strokeStyle='#caa66a';ctx.lineWidth=pathWidth;
  ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke();
  ctx.setLineDash([5,11]);ctx.strokeStyle='rgba(108,77,42,.28)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke();ctx.setLineDash([]);

  // base
  const bx=W-16, by=path[path.length-1].y;
  ctx.fillStyle='#27332b';ctx.fillRect(bx-18,by-29,36,58);
  ctx.fillStyle='#d9d8c8';ctx.fillRect(bx-13,by-23,26,46);
  ctx.fillStyle='#9f493e';ctx.fillRect(bx-6,by+2,12,21);

  // selected tower ghost range hint in corner label
  const spec=towerTypes[selected];

  for(const t of towers){
    const s=towerTypes[t.type];
    ctx.save();ctx.translate(t.x,t.y);
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(2,7,s.radius+4,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3b4a3e';ctx.beginPath();ctx.arc(0,0,s.radius+4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,0,s.radius,0,Math.PI*2);ctx.fill();
    ctx.rotate(t.angle);
    ctx.fillStyle='#29352d';ctx.fillRect(0,-3,s.radius+10,6);
    ctx.restore();
  }

  for(const e of enemies){
    ctx.save();ctx.translate(e.x,e.y);
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(1,e.radius*.55,e.radius*1.05,e.radius*.55,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.boss?'#65384a':'#864e43';ctx.beginPath();ctx.arc(0,0,e.radius,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.boss?'#ffcd5d':'#e8b472';ctx.beginPath();ctx.arc(-e.radius*.25,-e.radius*.2,e.radius*.28,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#161d19';ctx.beginPath();ctx.arc(e.radius*.15,-e.radius*.18,2.1,0,Math.PI*2);ctx.fill();
    ctx.restore();
    const bw=e.boss?42:26,bh=4;
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(e.x-bw/2,e.y-e.radius-10,bw,bh);
    ctx.fillStyle=e.hp/e.maxHp>.4?'#6bd26b':'#ff6b6b';ctx.fillRect(e.x-bw/2,e.y-e.radius-10,bw*Math.max(0,e.hp/e.maxHp),bh);
  }

  for(const b of bullets){
    ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.type==='cannon'?5:3,0,Math.PI*2);ctx.fill();
  }
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life*3);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(running && !ended){
    ctx.fillStyle='rgba(10,25,13,.58)';ctx.fillRect(8,H-31,138,23);
    ctx.fillStyle='#fff';ctx.font='700 11px system-ui';ctx.fillText('Selected: '+selected.toUpperCase(),16,H-15);
  }
}

function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt,now);draw();requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
resize();updateHUD();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
